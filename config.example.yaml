# Example configuration for restic-defensive-mcp.
# Copy and adjust paths. Never commit real secrets.
#
#   restic-defensive-mcp --config /path/to/config.yaml
#
# Validate without contacting a repository:
#   restic-defensive-mcp --config /path/to/config.yaml --validate-config
# Add an explicit bounded connectivity check:
#   restic-defensive-mcp --config /path/to/config.yaml --diagnose
#
# Callers may only pass repository_id values defined here.
# Repository URLs, backends, password files, and cache dirs are NOT accepted
# from MCP tool arguments.

version: 1

# Optional absolute path to restic. Default: look up "restic" on PATH at boot.
# restic_binary: /usr/local/bin/restic

limits:
  # Bounds for ordinary commands (snapshots, get_snapshot).
  command_timeout: 30s
  # Bounds for ls / find / stats.
  expensive_command_timeout: 5m
  max_snapshots: 100
  max_nodes: 500
  max_find_results: 200
  # Cap on restic stdout/stderr retained per buffered command, and on stderr
  # for streaming ls/find scans (bytes). Range: 65536..33554432.
  max_output_bytes: 8388608
  # Raw stdout bytes consumed by one incremental ls/find scan (bytes).
  # Range: 65536..67108864. Default: 16777216.
  max_scan_bytes: 16777216
  # Decoded JSON records (nodes, groups, matches) visited by one scan.
  # Range: 1..1000000. Default: 50000.
  max_decoded_entries: 50000
  # Encoded public response ceiling (bytes). Oversized pages fail with
  # response_limit_exceeded instead of being silently truncated.
  # Range: 16384..16777216. Default: 2097152.
  max_response_bytes: 2097152
  max_concurrent_per_repo: 1
  max_concurrent_global: 4
  # Optional short-lived in-memory cache for identical successful snapshot
  # metadata queries. 0 disables. Allowed: 1s..5m; max entries 1..1024.
  metadata_cache_ttl: 0s
  metadata_cache_max_entries: 0

repositories:
  - id: local-example
    # Optional non-sensitive label shown to MCP clients.
    label: Example local repository
    # File containing the repository location (path or URL). Mode 0600, not a symlink.
    # Its value is loaded and sealed at boot; restart to change repositories.
    repository_file: /run/secrets/restic-repository
    # File containing the repository password. Mode 0600, not a symlink.
    # Restic reads its current contents for each command. Keep replacement files private.
    password_file: /run/secrets/restic-password
    # Optional dedicated cache directory for this repository.
    cache_dir: /var/cache/restic-defensive/local-example
    # Restrictions (enforced server-side, not cosmetics). Empty list = NO restriction for
    # that dimension: empty allowed_paths exposes all snapshot path metadata to clients.
    # Prefer explicit allowlists in production. Boot logs empty_allowlist warnings when
    # any of these lists is empty (warn only; server still starts).
    allowed_hosts: [example-host]
    allowed_tags: [daily, weekly]
    allowed_paths:
      - /srv/data
      - /etc/example
    # Optional KEY=VALUE files for backend credentials (AWS_*, B2_*, RESTIC_REST_*).
    # Must not set RESTIC_PASSWORD, RESTIC_REPOSITORY, or RESTIC_PASSWORD_COMMAND.
    # S3 requires nonempty AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY, with optional AWS_SESSION_TOKEN.
    # Instance-role credentials and anonymous S3 access are unsupported.
    # AWS_PROFILE and AWS_SHARED_CREDENTIALS_FILE are rejected because profiles can run helpers.
    # env_files:
    #   - /run/secrets/restic-s3-env

  # - id: offsite-s3-example
  #   label: Offsite S3 (example only)
  #   repository_file: /run/secrets/restic-s3-repository
  #   password_file: /run/secrets/restic-s3-password
  #   cache_dir: /var/cache/restic-defensive/offsite-s3
  #   allowed_hosts: [backup-host]
  #   allowed_tags: [daily]
  #   allowed_paths: [/srv/data]
  #   env_files: [/run/secrets/restic-s3-env]
