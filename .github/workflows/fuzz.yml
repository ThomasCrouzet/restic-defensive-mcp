name: fuzz

on:
  schedule:
    # Weekly bounded random exploration, separate from pull-request validation.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Per-target fuzz duration (Go duration syntax)
        required: false
        default: 60s
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'
  GOMAXPROCS: '2'
  FUZZ_TIME: ${{ github.event.inputs.fuzztime || '60s' }}

jobs:
  explore:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - package: ./internal/config
            target: FuzzParse
          - package: ./internal/policy
            target: FuzzCleanPath
          - package: ./internal/redaction
            target: FuzzSanitize
          - package: ./internal/restic
            target: FuzzParseSnapshots
          - package: ./internal/restic
            target: FuzzParseLS
          - package: ./internal/restic
            target: FuzzMapExit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: record exploration budget
        run: |
          set -euo pipefail
          echo "source_revision=${GITHUB_SHA}"
          echo "go_version=${GO_VERSION}"
          echo "target=${{ matrix.target }}"
          echo "package=${{ matrix.package }}"
          echo "fuzz_time=${FUZZ_TIME}"
          echo "gomaxprocs=${GOMAXPROCS}"
          echo "job_timeout_minutes=15"
          echo "max_parallel=2"

      - name: explore ${{ matrix.target }}
        run: |
          set -euo pipefail
          go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "${FUZZ_TIME}"
