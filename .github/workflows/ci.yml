name: ci

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz:
        description: Run random fuzz exploration
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'
  MIN_GO_VERSION: '1.26.10'
  RESTIC_VERSIONS: '0.17.1 0.19.1'
  GOVULNCHECK_VERSION: 'v1.9.0'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: download modules
        run: go mod download && go mod verify

      - name: minimum Go build smoke
        run: |
          GOTOOLCHAIN="go${MIN_GO_VERSION}" go version
          GOTOOLCHAIN="go${MIN_GO_VERSION}" go build -trimpath -o "$RUNNER_TEMP/restic-defensive-mcp-min-go" ./cmd/restic-defensive-mcp

      - name: gofmt
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: cache lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: lint-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-v2.15.0-${{ hashFiles('go.sum', '.golangci.yml') }}

      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        with:
          version: v2.15.0
          args: --timeout=5m --build-tags=integration ./...
          skip-cache: true

      - name: test with race
        run: go test -race -count=1 ./...

      - name: fuzz smoke
        if: github.event_name == 'workflow_dispatch' && inputs.fuzz
        run: make fuzz-smoke

      - name: install restic versions
        run: |
          set -euo pipefail
          arch=amd64
          for ver in ${RESTIC_VERSIONS}; do
            install_dir="$RUNNER_TEMP/restic-${ver}"
            archive="$RUNNER_TEMP/restic-${ver}.bz2"
            sums="$RUNNER_TEMP/restic-${ver}-SHA256SUMS"
            asset="restic_${ver}_linux_${arch}.bz2"
            base="https://github.com/restic/restic/releases/download/v${ver}"
            mkdir -p "$install_dir"
            curl -fsSL -o "$archive" "${base}/${asset}"
            curl -fsSL -o "$sums" "${base}/SHA256SUMS"
            expected="$(awk -v asset="$asset" '$2 == asset {print $1}' "$sums")"
            test -n "$expected"
            echo "$expected  $archive" | sha256sum -c -
            bunzip2 -c "$archive" >"$install_dir/restic"
            chmod +x "$install_dir/restic"
            "$install_dir/restic" version
          done

      - name: integration tests
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/restic-defensive-mcp-e2e"
          mkdir -p "$artifact_dir"
          for ver in ${RESTIC_VERSIONS}; do
            echo "Testing with restic ${ver}"
            command="GOMAXPROCS=2 GOFLAGS=-p=1 go test -tags=integration -count=1 -timeout 5m -v ."
            PATH="$RUNNER_TEMP/restic-${ver}:$PATH" \
              GOMAXPROCS=2 \
              GOFLAGS=-p=1 \
              RESTIC_MCP_ARTIFACT_DIR="$artifact_dir" \
              RESTIC_MCP_E2E_COMMAND="$command" \
              go test -tags=integration -count=1 -timeout 5m -v .
          done

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: build multi-arch smoke
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' \
              -o "dist/restic-defensive-mcp-${os}-${arch}${ext}" ./cmd/restic-defensive-mcp
          done
          ls -la dist/

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install gitleaks
        run: |
          set -euo pipefail
          ver="${GITLEAKS_VERSION}"
          asset="gitleaks_${ver}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/gitleaks_${ver}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${ver}_checksums.txt" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          chmod +x gitleaks

      - name: scan git history
        run: ./gitleaks git . --redact --no-banner

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, secrets]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
