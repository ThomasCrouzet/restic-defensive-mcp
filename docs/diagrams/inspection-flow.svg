<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">Restricted restic inspection flow</title>
  <desc id="desc">A stdio client supplies a repository ID and typed tool arguments. Startup configuration fixes repository locations and secrets. Host, tag, and path policies constrain a shell-free runner to version, snapshots, ls, find, and stats. Results contain bounded metadata. Restic can still use cache files and repository locks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a46720"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#43341e}.title{font-size:30px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#74654e}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#94601e}.box{fill:#fff;stroke:#e2d5bf;stroke-width:1.5}.line{fill:none;stroke:#a46720;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="580" rx="24" fill="#fbf8f1"/>
  <text x="40" y="39" class="eyebrow">RESTIC DEFENSIVE MCP / INSPECTION PATH</text>
  <text x="40" y="79" class="title">Repository IDs in. Bounded metadata out.</text>
  <path d="M40 106H1080" stroke="#e2d5bf"/>
  <rect x="330" y="139" width="442" height="70" rx="12" fill="#f4ead8"/>
  <text x="352" y="168" class="label">Startup configuration</text>
  <text x="352" y="193" class="body">Fixed locations + permission-checked secret files</text>
  <path d="M439 209V260" class="line"/>
  <path d="M674 209V260" class="line"/>
  <rect x="40" y="262" width="214" height="148" rx="14" class="box"/>
  <text x="62" y="300" class="label">MCP client</text>
  <text x="62" y="331" class="body">stdio / seven tools</text>
  <text x="62" y="365" class="small">repository_id</text>
  <text x="62" y="387" class="small">Typed tool arguments</text>
  <path d="M254 335H306" class="line"/>
  <rect x="308" y="262" width="246" height="148" rx="14" class="box"/>
  <text x="330" y="300" class="label">Policy</text>
  <text x="330" y="331" class="body">Hosts / tags / paths</text>
  <text x="330" y="365" class="small">Result limits</text>
  <text x="330" y="387" class="small">Cost classes</text>
  <path d="M554 335H606" class="line"/>
  <rect x="608" y="262" width="246" height="148" rx="14" class="box"/>
  <text x="630" y="300" class="label">Fixed restic argv</text>
  <text x="630" y="331" class="body">version / snapshots</text>
  <text x="630" y="359" class="body">ls / find / stats</text>
  <text x="630" y="387" class="small">No shell / sealed environment</text>
  <path d="M854 335H906" class="line"/>
  <rect x="908" y="262" width="172" height="148" rx="14" fill="#43341e"/>
  <text x="928" y="300" style="font:700 20px Arial,Helvetica,sans-serif;fill:#fff">Repository</text>
  <text x="928" y="335" style="font:16px Arial,Helvetica,sans-serif;fill:#fff">Local / S3</text>
  <text x="928" y="363" style="font:16px Arial,Helvetica,sans-serif;fill:#fff">B2 / REST</text>
  <path d="M994 410V462H554" class="line"/>
  <rect x="308" y="438" width="246" height="48" rx="12" fill="#f4ead8"/>
  <text x="330" y="468" class="body">Filter + redact metadata</text>
  <path d="M308 462H147V412" class="line"/>
  <text x="40" y="542" class="body">No file contents or restore verification.</text>
  <text x="608" y="542" class="body">restic can write caches and take repository locks.</text>
</svg>
